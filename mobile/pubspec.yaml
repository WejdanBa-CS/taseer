name: taseer
description: تسعير — سعر القطعة الأصلية قبل الورشة، غلاف Flutter لأندرويد وiOS.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.0
  webview_flutter_wkwebview: ^3.23.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  in_app_purchase: ^3.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/www/index.html
    - assets/www/favicon.svg
    - assets/www/css/
    - assets/www/js/
    - assets/www/fonts/
