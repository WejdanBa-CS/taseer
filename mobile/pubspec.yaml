name: taseer
description: تسعير — تطبيق Flutter لأسعار قطع الغيار في السعودية.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.5.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  in_app_purchase: ^3.2.3
  google_fonts: ^8.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/parts.json
    - assets/data/dealers.json
    - assets/data/market_ranges.json
    - assets/data/cities.json
    - assets/data/sources.json
    - assets/data/fuels.json
    - assets/images/taseer-logo.png
    - assets/images/cars/
    - google_fonts/
