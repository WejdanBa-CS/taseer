# Blueprint اختياري: خادم Python احتياطي على Render.
# الإنتاج الافتراضي للتطبيق هو Supabase Edge Functions (Postgres دائم).
# خطة free تفقد SQLite بعد الخمول — لا تعتمد عليها كمصدر بيانات.
services:
  - type: web
    name: taseer-crowd
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server/crowd.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: TASEER_API_ONLY
        value: "1"
      - key: TASEER_BIND
        value: "0.0.0.0"
      # فارغ = بدون CORS مفتوح (مناسب لتطبيق الجوال). للموقع ضع نطاقك.
      - key: TASEER_CORS_ORIGINS
        value: ""
